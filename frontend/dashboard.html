<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your property listings on iStay - view, add, and remove your properties.">
    <title>Owner Dashboard — iStay</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-buildings"></i>iStay</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border-color: rgba(255,255,255,0.2);">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="houses.html">Houses</a></li>
                    <li class="nav-item"><a class="nav-link" href="rooms.html">Rooms</a></li>
                    <li class="nav-item"><a class="nav-link" href="lands.html">Lands</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2" id="authLinks">
                    <a href="login.html" class="nav-link" style="color: var(--light-3) !important;">Login</a>
                    <a href="register.html" class="btn btn-nav">Sign Up</a>
                </div>
                <div class="d-flex align-items-center gap-3" id="userLinks" style="display: none !important;">
                    <a href="add-property.html" class="nav-link" style="color: var(--light-3) !important;"><i class="bi bi-plus-circle me-1"></i>Add Property</a>
                    <a href="dashboard.html" class="nav-link active" style="color: var(--light-3) !important;"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" style="color: var(--light-3) !important;">
                            <i class="bi bi-person-circle me-1"></i><span class="user-name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="Auth.logout(); return false;"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header" style="padding-top: 100px;">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <h1><i class="bi bi-speedometer2 me-3"></i>Owner Dashboard</h1>
                    <p class="mb-0">Manage and track all your property listings</p>
                </div>
                <a href="add-property.html" class="btn btn-nav" style="padding: 0.6rem 1.5rem !important; font-size: 0.9rem !important;">
                    <i class="bi bi-plus-lg me-2"></i>Add New Property
                </a>
            </div>
        </div>
    </div>

    <!-- Dashboard Content -->
    <section class="py-5">
        <div class="container">
            <!-- Stats Cards -->
            <div class="row" id="dashboardStats">
                <!-- Stats loaded dynamically -->
            </div>

            <!-- Properties Table -->
            <div class="dashboard-table mt-4">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Property</th>
                                <th>Location</th>
                                <th>Price</th>
                                <th>Rooms</th>
                                <th>Type</th>
                                <th>Listed Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="propertiesTableBody">
                            <!-- Properties loaded dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 iStay. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
