<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore Houses on iStay. Find houses for rent or sale in your city.">
    <title>iStay — Houses for Rent &amp; Sale</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-category="HOUSE">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top" id="mainNavbar">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="index.html"><i class="bi bi-buildings"></i>iStay</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border-color: rgba(255,255,255,0.2);">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="houses.html">Houses</a></li>
                    <li class="nav-item"><a class="nav-link" href="rooms.html">Rooms</a></li>
                    <li class="nav-item"><a class="nav-link" href="lands.html">Lands</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2" id="authLinks">
                    <a href="login.html" class="nav-link" style="color: var(--light-3) !important;">Login</a>
                    <a href="register.html" class="btn btn-nav">Sign Up</a>
                </div>
                <div class="d-flex align-items-center gap-3" id="userLinks" style="display: none !important;">
                    <a href="add-property.html" class="nav-link" style="color: var(--light-3) !important;"><i class="bi bi-plus-circle me-1"></i>Add Property</a>
                    <a href="inbox.html" class="nav-link" style="color: var(--light-3) !important;"><i class="bi bi-envelope me-1"></i>Inbox</a>
                    <a href="dashboard.html" class="nav-link" style="color: var(--light-3) !important;"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" style="color: var(--light-3) !important;">
                            <i class="bi bi-person-circle me-1"></i><span class="user-name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="Auth.logout(); return false;"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="explore-wrapper">
        <!-- Sidebar Filters -->
        <aside class="explore-sidebar">
            <div class="sidebar-section">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="mb-0"><i class="bi bi-funnel me-1"></i> Filters</h6>
                    <button class="btn btn-link btn-sm text-danger p-0" id="clearFilters" style="font-size: 0.8rem;">Clear All</button>
                </div>
            </div>

            <div class="sidebar-section">
                <h6>Location</h6>
                <div class="autocomplete-wrapper">
                    <input type="text" class="form-control" id="searchLocation" placeholder="Search city, area..." autocomplete="off">
                    <div id="searchLocationSuggestions" class="autocomplete-dropdown"></div>
                </div>
            </div>

            <div class="sidebar-section">
                <h6>Budget</h6>
                <div class="budget-row">
                    <input type="number" class="form-control" id="searchMinPrice" placeholder="₹ Min">
                    <input type="number" class="form-control" id="searchMaxPrice" placeholder="₹ Max">
                </div>
            </div>

            <div class="sidebar-section">
                <h6>Property Type</h6>
                <div class="d-flex flex-wrap gap-1">
                    <label class="filter-chip"><input type="radio" name="propType" value="" checked><span>All</span></label>
                    <label class="filter-chip"><input type="radio" name="propType" value="RENT"><span>Rent</span></label>
                    <label class="filter-chip"><input type="radio" name="propType" value="SALE"><span>Sale</span></label>
                </div>
                <input type="hidden" id="searchType" value="">
            </div>

            <div class="sidebar-section">
                <h6>No. of Bedrooms</h6>
                <div class="d-flex flex-wrap gap-1">
                    <label class="filter-chip"><input type="radio" name="bedrooms" value="" checked><span>Any</span></label>
                    <label class="filter-chip"><input type="radio" name="bedrooms" value="1"><span>1 BHK</span></label>
                    <label class="filter-chip"><input type="radio" name="bedrooms" value="2"><span>2 BHK</span></label>
                    <label class="filter-chip"><input type="radio" name="bedrooms" value="3"><span>3 BHK</span></label>
                    <label class="filter-chip"><input type="radio" name="bedrooms" value="4"><span>4+ BHK</span></label>
                </div>
                <input type="hidden" id="searchRooms" value="">
            </div>

            <div class="sidebar-section">
                <h6>Amenities</h6>
                <div class="d-flex flex-wrap gap-1" id="searchAmenitiesGroup">
                    <label class="filter-chip"><input type="checkbox" value="Parking"><span>Parking</span></label>
                    <label class="filter-chip"><input type="checkbox" value="Garden"><span>Garden</span></label>
                    <label class="filter-chip"><input type="checkbox" value="Security"><span>Security</span></label>
                    <label class="filter-chip"><input type="checkbox" value="Gym"><span>Gym</span></label>
                    <label class="filter-chip"><input type="checkbox" value="Pool"><span>Pool</span></label>
                    <label class="filter-chip"><input type="checkbox" value="Power Backup"><span>Power Backup</span></label>
                </div>
            </div>

            <button class="btn btn-sidebar-search" id="searchBtn"><i class="bi bi-search me-2"></i>Search Houses</button>
            <button class="btn btn-sidebar-clear" id="clearFiltersBtn"><i class="bi bi-x-lg me-1"></i>Reset Filters</button>
        </aside>

        <!-- Main Content -->
        <main class="explore-main">
            <div class="explore-header">
                <div>
                    <h4><span class="result-count" id="resultCount">0</span> Houses Found</h4>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn-toggle-map" id="btnToggleMap" onclick="MapView.toggle()">
                        <i class="bi bi-map me-1"></i> Map View
                    </button>
                    <div class="sort-bar">
                        <label>Sort by:</label>
                        <select class="form-select" id="sortBy">
                            <option value="createdAt">Newest First</option>
                            <option value="price">Price</option>
                        </select>
                        <select class="form-select" id="sortDirection">
                            <option value="desc">High to Low</option>
                            <option value="asc">Low to High</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Map View Section -->
            <div id="mapViewSection" class="map-view-section">
                <div class="map-view-header">
                    <h6><i class="bi bi-pin-map-fill"></i> Properties on Map <span class="map-stats-badge" id="mapMarkerCount">0 pins</span></h6>
                    <div class="map-view-controls">
                        <button class="btn-map-control" id="btnDetectLocation" onclick="MapView.detectLocation()">
                            <i class="bi bi-crosshair"></i> My Location
                        </button>
                    </div>
                </div>
                <div id="propertyMapView"></div>
            </div>

            <div class="quick-filters">
                <button class="quick-filter-btn" data-type="RENT"><i class="bi bi-key"></i> For Rent</button>
                <button class="quick-filter-btn" data-type="SALE"><i class="bi bi-cart"></i> For Sale</button>
                <button class="quick-filter-btn" data-suitable="FAMILY"><i class="bi bi-people"></i> Family</button>
                <button class="quick-filter-btn" data-suitable="SOLO_EMPLOYEE"><i class="bi bi-briefcase"></i> Working Pro</button>
            </div>

            <div id="propertiesGrid">
                <!-- Properties loaded dynamically -->
            </div>

            <div id="pagination" class="mt-3"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/api.js"></script>
    <script src="js/map-view.js"></script>
    <script src="js/explore.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
