<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View property details on iStay - complete information about the listing.">
    <title>Property Details — iStay</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-buildings"></i>iStay</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border-color: rgba(255,255,255,0.2);">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2" id="authLinks">
                    <a href="login.html" class="nav-link" style="color: var(--light-3) !important;">Login</a>
                    <a href="register.html" class="btn btn-nav">Sign Up</a>
                </div>
                <div class="d-flex align-items-center gap-3" id="userLinks" style="display: none !important;">
                    <a href="add-property.html" class="nav-link" style="color: var(--light-3) !important;"><i class="bi bi-plus-circle me-1"></i>Add Property</a>
                    <a href="inbox.html" class="nav-link" style="color: var(--light-3) !important;"><i class="bi bi-envelope me-1"></i>Inbox</a>
                    <a href="dashboard.html" class="nav-link" style="color: var(--light-3) !important;"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" style="color: var(--light-3) !important;">
                            <i class="bi bi-person-circle me-1"></i><span class="user-name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="Auth.logout(); return false;"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div style="padding-top: 90px; padding-bottom: 60px;">
        <div class="container" id="propertyDetail">
            <div class="loading-spinner">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
        </div>
    </div>

    <!-- Chat Modal -->
    <div class="modal fade" id="chatModal" tabindex="-1" aria-labelledby="chatModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow" style="border-radius: var(--radius-lg);">
                <div class="modal-header bg-primary text-white border-0" style="border-radius: var(--radius-lg) var(--radius-lg) 0 0;">
                    <h5 class="modal-title" id="chatModalLabel">
                        <i class="bi bi-chat-dots-fill me-2"></i>Chat with Owner
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body bg-light" id="chatMessages" style="height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                    <!-- Messages loaded dynamically -->
                    <div class="text-center text-muted mt-3" id="chatLoading">
                        <div class="spinner-border spinner-border-sm" role="status"></div> Loading...
                    </div>
                </div>
                <div class="modal-footer bg-white border-top p-3">
                    <form id="chatForm" class="w-100 d-flex gap-2 m-0">
                        <input type="text" id="chatInput" class="form-control rounded-pill" placeholder="Type a message..." required autocomplete="off">
                        <button type="submit" class="btn btn-primary rounded-circle" style="width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center;">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 iStay. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <!-- Custom JS -->
    <script src="js/api.js"></script>
    <script src="js/property.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
