<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to iStay to manage your properties and access exclusive features.">
    <title>Login — iStay</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .role-toggle {
            display: flex;
            background: rgba(255,255,255,0.08);
            border-radius: 50px;
            padding: 4px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .role-toggle .role-btn {
            flex: 1;
            text-align: center;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            color: rgba(255,255,255,0.5);
            border: none;
            background: transparent;
        }
        .role-toggle .role-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(var(--primary-rgb), 0.4);
        }
        .role-toggle .role-btn:hover:not(.active) {
            color: rgba(255,255,255,0.8);
        }
        .role-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: block;
        }
    </style>
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="text-center mb-4">
                <a href="index.html" style="font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, var(--primary-light), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                    <i class="bi bi-buildings" style="-webkit-text-fill-color: var(--primary-light); margin-right: 6px;"></i>iStay
                </a>
            </div>

            <!-- Role Toggle -->
            <div class="role-toggle" id="roleToggle">
                <button type="button" class="role-btn active" data-role="BUYER" onclick="setLoginRole('BUYER')">
                    <i class="bi bi-search me-2"></i>Login as Buyer
                </button>
                <button type="button" class="role-btn" data-role="SELLER" onclick="setLoginRole('SELLER')">
                    <i class="bi bi-shop me-2"></i>Login as Seller
                </button>
            </div>

            <div class="text-center mb-3">
                <span class="role-icon" id="loginRoleIcon">🏠</span>
                <h2 id="loginTitle">Welcome Back, Buyer!</h2>
                <p id="loginSubtitle">Sign in to discover your dream property</p>
            </div>

            <form id="loginForm">
                <input type="hidden" id="loginRole" value="BUYER">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-auth mb-3" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In as Buyer
                </button>
                <p class="text-center" style="color: var(--light-3); font-size: 0.9rem;">
                    Don't have an account? <a href="register.html" class="auth-link">Sign Up</a>
                </p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        function setLoginRole(role) {
            document.getElementById('loginRole').value = role;
            document.querySelectorAll('#roleToggle .role-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.role === role);
            });
            if (role === 'BUYER') {
                document.getElementById('loginRoleIcon').textContent = '🏠';
                document.getElementById('loginTitle').textContent = 'Welcome Back, Buyer!';
                document.getElementById('loginSubtitle').textContent = 'Sign in to discover your dream property';
                document.getElementById('loginBtn').innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In as Buyer';
            } else {
                document.getElementById('loginRoleIcon').textContent = '🔑';
                document.getElementById('loginTitle').textContent = 'Welcome Back, Seller!';
                document.getElementById('loginSubtitle').textContent = 'Sign in to manage your property listings';
                document.getElementById('loginBtn').innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In as Seller';
            }
        }
    </script>
    <script src="js/auth.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
