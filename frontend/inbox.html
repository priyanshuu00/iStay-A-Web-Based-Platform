<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View and reply to property inquiries on iStay.">
    <title>Inbox — iStay</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .chat-container {
            height: calc(100vh - 200px);
            min-height: 500px;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            display: flex;
            overflow: hidden;
            border: 1px solid var(--light-2);
        }
        .conversation-list {
            width: 350px;
            border-right: 1px solid var(--light-2);
            display: flex;
            flex-direction: column;
            background: #fafafa;
        }
        .conversation-item {
            padding: 15px;
            border-bottom: 1px solid var(--light-2);
            cursor: pointer;
            transition: background 0.2s;
        }
        .conversation-item:hover {
            background: rgba(var(--primary-rgb), 0.05);
        }
        .conversation-item.active {
            background: rgba(var(--primary-rgb), 0.1);
            border-right: 3px solid var(--primary);
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }
        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--light-2);
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f8f9fa;
        }
        .chat-input-area {
            padding: 15px;
            border-top: 1px solid var(--light-2);
            background: white;
        }
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }
        .msg-bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 0.95rem;
            position: relative;
        }
        .msg-mine {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 2px;
            align-self: flex-end;
        }
        .msg-theirs {
            background: white;
            border: 1px solid var(--light-2);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
            align-self: flex-start;
        }
        .msg-time {
            font-size: 0.7rem;
            margin-top: 5px;
            opacity: 0.7;
            text-align: right;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-buildings"></i>iStay</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="houses.html">Houses</a></li>
                    <li class="nav-item"><a class="nav-link" href="rooms.html">Rooms</a></li>
                    <li class="nav-item"><a class="nav-link" href="lands.html">Lands</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3" id="userLinks">
                    <a href="inbox.html" class="nav-link active" style="color: var(--light-3) !important;"><i class="bi bi-envelope me-1"></i>Inbox</a>
                    <a href="dashboard.html" class="nav-link" style="color: var(--light-3) !important;"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" style="color: var(--light-3) !important;">
                            <i class="bi bi-person-circle me-1"></i><span class="user-name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="Auth.logout(); return false;"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div style="padding-top: 90px; padding-bottom: 40px;">
        <div class="container">
            <h2 class="mb-4"><i class="bi bi-chat-left-dots-fill me-2 text-primary"></i>Your Inbox</h2>
            
            <div class="chat-container">
                <!-- Conversation List (Left Sidebar) -->
                <div class="conversation-list">
                    <div class="p-3 border-bottom bg-white font-weight-bold">
                        Conversations
                    </div>
                    <div id="conversationsContainer" style="overflow-y: auto; flex: 1;">
                        <div class="text-center p-4 text-muted">
                            <div class="spinner-border spinner-border-sm" role="status"></div> Loading...
                        </div>
                    </div>
                </div>

                <!-- Chat Area (Right Side) -->
                <div class="chat-area">
                    <div id="noChatSelected" class="empty-chat">
                        <i class="bi bi-chat-dots" style="font-size: 3rem; color: var(--light-3);"></i>
                        <h5 class="mt-3">Select a conversation</h5>
                        <p>Choose a conversation from the left to view messages.</p>
                    </div>

                    <div id="activeChat" class="d-none" style="display: flex; flex-direction: column; height: 100%;">
                        <div class="chat-header">
                            <div>
                                <h6 class="mb-0" id="chatTitle">Property Name</h6>
                                <small class="text-muted" id="chatPartner">Chatting with ...</small>
                            </div>
                            <a href="#" id="viewPropertyBtn" class="btn btn-sm btn-outline-primary">View Property</a>
                        </div>
                        <div class="chat-messages" id="chatMessages">
                            <!-- Messages -->
                        </div>
                        <div class="chat-input-area">
                            <form id="replyForm" class="d-flex gap-2 mb-0">
                                <input type="text" id="replyInput" class="form-control" placeholder="Type your reply..." required autocomplete="off">
                                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-send-fill me-2"></i>Send</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 iStay. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/inbox.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
