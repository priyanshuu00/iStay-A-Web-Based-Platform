# ============================================
# iStay Application Configuration
# ============================================
# Secrets are loaded from environment variables.
# Set ISTAY_DB_USERNAME, ISTAY_DB_PASSWORD, and ISTAY_JWT_SECRET
# in your environment for production deployments.

# Server
server.port=8081

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/istay_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${ISTAY_DB_USERNAME:root}
spring.datasource.password=${ISTAY_DB_PASSWORD:Bhatt@0090}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${ISTAY_JWT_SECRET:iStayDevOnlyFallbackKey2026MustBeAtLeast32CharsForHS256}
app.jwt.expiration-ms=86400000

# Gemini AI Configuration
app.gemini.api-key=${GEMINI_API_KEY:AIzaSyADi2oU6HYECgnK_lckKIVAJ6Q_LbfN2eY}

# Multipart (for future image upload)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
